name: LetMeLook
version: 0.2.0
main: com.letseries.letmelook.bukkit.LetMeLookPlugin
api-version: 1.20
author: LetSeries
description: CoreProtect replay bridge for LetMeLook Fabric client (Purpur 1.21.11)
depend: [CoreProtect]
commands:
  letmelook:
    description: LetMeLook admin commands
    usage: /letmelook <status|reload>
    aliases: [lml]
    permission: letmelook.admin
    permission-message: You lack letmelook.admin
permissions:
  letmelook.use:
    description: Request replay lookups
    default: op
  letmelook.admin:
    description: Admin controls (/letmelook status, reload)
    default: op
